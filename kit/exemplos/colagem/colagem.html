<!doctype html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Homemade+Apple&family=Inter:wght@500;600&family=Instrument+Serif:ital@0;1&family=Noto+Color+Emoji&display=block" rel="stylesheet" />
<style>
  :root {
    --papel: #f6efe2;
    --creme: #fbf6ea;
    --tinta: #2b2622;
    --rosa: #f4a7c3;
    --rosa-forte: #e86a9b;
    --amarelo: #fbf3a6;
    --azul: #2f6bff;
    --vinho: #a3243b;
    --dourado: #c99a2e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    background: var(--papel);
    font-family: Inter, sans-serif;
    color: var(--tinta);
    position: relative;
  }
  /* grão de papel */
  body::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .18; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .emoji { font-family: "Noto Color Emoji"; }
  .abs { position: absolute; }

  /* foto (troque o background por url('sua-foto.jpg')) */
  .foto {
    background: linear-gradient(160deg, #d9c3a5, #b88f6a 55%, #7d5a43);
    display: flex; align-items: flex-end; justify-content: center;
    font: 600 22px Inter; color: rgba(255,255,255,.75); padding-bottom: 18px;
    background-size: cover; background-position: center;
  }
  .foto.f2 { background: linear-gradient(200deg, #e8c9cf, #c98d9a 50%, #8f5d6a); }
  .foto.f3 { background: linear-gradient(170deg, #c9d3c0, #8fa184 50%, #5d6b55); }
  .foto.f4 { background: linear-gradient(180deg, #e9dcc8, #cdb18c 60%, #9c7b58); }

  /* polaroid */
  .polaroid { background: #fff; padding: 18px 18px 64px; box-shadow: 0 10px 30px rgba(60,40,20,.18); }
  .polaroid .legenda { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; font: 28px "Homemade Apple"; color: #555; }

  /* selo com borda serrilhada */
  .selo {
    padding: 12px;
    background: radial-gradient(circle, transparent 7px, var(--creme) 7.5px) -11px -11px / 22px 22px;
    filter: drop-shadow(0 8px 14px rgba(60,40,20,.2));
  }
  .selo > .miolo { background: var(--creme); padding: 34px 28px; border: 2px solid #e6dcc8; }
  .manuscrito { font-family: "Homemade Apple"; color: #6b5a48; line-height: 1.6; }

  /* etiquetas de palavras */
  .tag { display: inline-block; background: var(--rosa); color: var(--tinta); font: 600 30px Inter; padding: 4px 14px; margin: 4px; border-radius: 4px; box-shadow: 0 3px 0 rgba(0,0,0,.08); }

  /* pílulas */
  .pill { background: #fff; border-radius: 999px; padding: 10px 22px; font: 500 22px Inter; box-shadow: 0 4px 12px rgba(0,0,0,.12); white-space: nowrap; }

  /* cartão central */
  .cartao {
    background: var(--creme); border: 4px dashed var(--tinta); padding: 54px 50px 40px; text-align: center;
    box-shadow: 0 16px 40px rgba(60,40,20,.22);
  }
  .titulo { font: 800 112px/0.92 "Bricolage Grotesque"; letter-spacing: -0.03em; }
  .titulo em { font: italic 400 120px "Instrument Serif"; letter-spacing: -0.02em; }
  .faixa-amarela { background: var(--amarelo); font: 800 46px/0.95 "Bricolage Grotesque"; padding: 14px 26px; border: 3px solid var(--tinta); }
  .faixa-azul { display: inline-block; background: var(--azul); color: #fff; font: 800 44px/1 "Bricolage Grotesque"; padding: 14px 30px; margin-top: 26px; border: 3px solid #fff; outline: 3px solid var(--azul); }

  /* widget de calendário */
  .cal { background: #fff; border-radius: 16px; padding: 14px 18px; width: 300px; box-shadow: 0 8px 24px rgba(0,0,0,.15); font: 500 16px Inter; color: #8a8a8a; }
  .cal .ev { margin-top: 8px; border-left: 5px solid #4b8df8; background: #e8f0fe; border-radius: 6px; padding: 8px 12px; color: #1f4fa8; font-weight: 600; font-size: 20px; }
  .cal .ev small { display: block; font-weight: 500; font-size: 15px; color: #5b7cc4; }

  .listras { background: repeating-linear-gradient(90deg, var(--vinho) 0 22px, #f3e6e0 22px 40px); }
  .xadrez { background:
      repeating-linear-gradient(0deg, rgba(232,106,155,.35) 0 18px, transparent 18px 54px),
      repeating-linear-gradient(90deg, rgba(201,154,46,.35) 0 18px, transparent 18px 54px), #f7ecdc; }
</style>
</head>
<body>
  <!-- texturas de fundo -->
  <div class="abs listras" style="right:0; top:0; width:330px; height:330px;"></div>
  <div class="abs xadrez" style="left:330px; bottom:0; width:420px; height:300px;"></div>

  <!-- fotos -->
  <div class="abs foto f1" style="left:0; top:330px; width:330px; height:520px;">sua foto</div>
  <div class="abs foto f2" style="right:0; top:330px; width:330px; height:560px;">sua foto</div>
  <div class="abs foto f3" style="left:0; bottom:0; width:330px; height:500px;">sua foto</div>
  <div class="abs foto f4" style="right:0; bottom:0; width:330px; height:460px;">sua foto</div>

  <!-- selo manuscrito -->
  <div class="abs selo" style="left:30px; top:40px; width:310px; transform:rotate(-3deg);"><div class="miolo">
    <p class="manuscrito" style="font-size:25px;">um sábado lento, café quente e nenhum plano :)</p>
    <p style="font:500 15px Inter; color:#a08d78; margin-top:16px; text-align:center;">@paulinhavianna</p>
  </div></div>
  <div class="abs emoji" style="left:300px; top:30px; font-size:54px; transform:rotate(12deg);">⭐</div>
  <div class="abs emoji" style="left:30px; top:270px; font-size:40px;">⭐</div>

  <!-- polaroid -->
  <div class="abs polaroid" style="left:380px; top:40px; width:330px; height:330px; transform:rotate(4deg);">
    <div class="foto f2" style="width:100%; height:100%;">sua foto</div>
    <div class="legenda">outono, oi</div>
  </div>

  <!-- etiquetas -->
  <div class="abs" style="left:350px; top:420px; width:420px; transform:rotate(-2deg);">
    <span class="tag">ninguém</span><span class="tag">perguntou</span><span class="tag">mas</span>
  </div>

  <!-- cartão central -->
  <div class="abs faixa-amarela" style="left:290px; top:560px; transform:rotate(-4deg); z-index:3;">diário de<br>outono</div>
  <div class="abs cartao" style="left:250px; top:620px; width:580px; transform:rotate(1.5deg); z-index:2;">
    <div class="titulo">um dia<br><em>comigo</em>...</div>
    <div class="faixa-azul">rotina + café</div>
  </div>
  <div class="abs emoji" style="left:215px; top:690px; font-size:84px; z-index:4;">👀</div>
  <div class="abs emoji" style="left:780px; top:900px; font-size:80px; z-index:4;">✨</div>
  <div class="abs emoji" style="left:330px; top:520px; font-size:60px; z-index:4;">🌸</div>

  <!-- calendário -->
  <div class="abs cal" style="right:20px; top:640px; z-index:4; transform:rotate(-2deg);">
    09:00
    <div class="ev">morning routine<small>09:00 – 10:00</small></div>
  </div>

  <!-- pílulas -->
  <div class="abs pill" style="left:24px; top:1110px; transform:rotate(-3deg); z-index:5;">café superfaturado</div>
  <div class="abs pill" style="left:40px; top:1180px; transform:rotate(2deg); z-index:5;">fazer comprinhas</div>
  <div class="abs pill" style="right:40px; top:1150px; transform:rotate(3deg); z-index:5;">girls date</div>
</body>
</html>

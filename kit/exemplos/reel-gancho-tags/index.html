<!doctype html>
<html lang="pt">

<style>

  .tag { display: inline-block; background: #f6a8c8; color: #2a1a1f; font: 600 64px/1 Poppins; padding: 12px 22px 14px;

</style>
</head>

    <div id="etiquetas" class="clip" data-start="0" data-duration="2.6" data-track-index="1">
